# Climate sensitivity scenarios for expansion E2 (owner: Ömer, Rol A; ids to be confirmed by
# Gümüş in the contract: results/{location_id}__{scenario_id}.json, site_index.scenarios).
#
# "Delta change" tests, NOT climate projections: the same 24 historical years, with daily
# precipitation scaled and daily temperatures shifted. Label in the UI:
# "What if the same 24 years were drier or warmer?"
# Temperature shifts move T2M_MAX, T2M_MIN and T2MDEW together, so relative humidity stays
# roughly constant; ET0 is recomputed from the shifted weather. Wind and radiation unchanged.
# The step sizes are the ones named in PLAN_EXPANSION E2 (a project choice, not a forecast).

scenarios:
  - id: baseline
    label: { en: "Past climate (2001–2026)", tr: "Geçmiş iklim (2001–2026)" }
    precip_factor: { value: 1.0, unit: "-", source: "No change", type: assumption, verified: true }
    temp_shift_c: { value: 0.0, unit: "°C", source: "No change", type: assumption, verified: true }
  - id: dry10
    label: { en: "10 % less rain", tr: "%10 daha az yağış" }
    precip_factor: { value: 0.9, unit: "-", source: "PLAN_EXPANSION E2: precipitation × 0.9 (sensitivity step, not a projection)", type: assumption, verified: true }
    temp_shift_c: { value: 0.0, unit: "°C", source: "No change", type: assumption, verified: true }
  - id: dry20
    label: { en: "20 % less rain", tr: "%20 daha az yağış" }
    precip_factor: { value: 0.8, unit: "-", source: "PLAN_EXPANSION E2: precipitation × 0.8 (sensitivity step, not a projection)", type: assumption, verified: true }
    temp_shift_c: { value: 0.0, unit: "°C", source: "No change", type: assumption, verified: true }
  - id: warm1
    label: { en: "1 °C warmer", tr: "1 °C daha sıcak" }
    precip_factor: { value: 1.0, unit: "-", source: "No change", type: assumption, verified: true }
    temp_shift_c: { value: 1.0, unit: "°C", source: "PLAN_EXPANSION E2: +1 °C on Tmax, Tmin and Tdew (sensitivity step, not a projection)", type: assumption, verified: true }
  - id: warm2
    label: { en: "2 °C warmer", tr: "2 °C daha sıcak" }
    precip_factor: { value: 1.0, unit: "-", source: "No change", type: assumption, verified: true }
    temp_shift_c: { value: 2.0, unit: "°C", source: "PLAN_EXPANSION E2: +2 °C on Tmax, Tmin and Tdew (sensitivity step, not a projection)", type: assumption, verified: true }
  - id: dry10_warm1
    label: { en: "10 % less rain and 1 °C warmer", tr: "%10 daha az yağış ve 1 °C daha sıcak" }
    precip_factor: { value: 0.9, unit: "-", source: "PLAN_EXPANSION E2 combined case: precipitation × 0.9", type: assumption, verified: true }
    temp_shift_c: { value: 1.0, unit: "°C", source: "PLAN_EXPANSION E2 combined case: +1 °C", type: assumption, verified: true }
