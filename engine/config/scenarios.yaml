# Climate sensitivity scenarios for expansion E2 (owner: Ömer, Rol A; ids to be confirmed by
# Gümüş in the contract: results/{location_id}__{scenario_id}.json, site_index.scenarios).
#
# "Delta change" tests, NOT climate projections: the same 24 historical years, with daily
# precipitation scaled and daily temperatures shifted. Label in the UI:
# "What if the same 24 years were drier or warmer?"
# Temperature shifts move T2M_MAX, T2M_MIN and T2MDEW together, so relative humidity stays
# roughly constant; ET0 is recomputed from the shifted weather. Wind and radiation unchanged.
# The step sizes are the ones named in PLAN_EXPANSION E2 (a project choice, not a forecast).

scenarios:
  - id: baseline
    label: { en: "Past climate (2001–2026)", tr: "Geçmiş iklim (2001–2026)" }
    precip_factor: { value: 1.0, unit: "-", source: "No change", type: assumption, verified: false }
    temp_shift_c: { value: 0.0, unit: "°C", source: "No change", type: assumption, verified: false }
  - id: dry10
    label: { en: "10 % less rain", tr: "%10 daha az yağış" }
    precip_factor: { value: 0.9, unit: "-", source: "PLAN_EXPANSION E2: precipitation × 0.9 (sensitivity step, not a projection)", type: assumption, verified: false }
    temp_shift_c: { value: 0.0, unit: "°C", source: "No change", type: assumption, verified: false }
  - id: dry20
    label: { en: "20 % less rain", tr: "%20 daha az yağış" }
    precip_factor: { value: 0.8, unit: "-", source: "PLAN_EXPANSION E2: precipitation × 0.8 (sensitivity step, not a projection)", type: assumption, verified: false }
    temp_shift_c: { value: 0.0, unit: "°C", source: "No change", type: assumption, verified: false }
  - id: warm1
    label: { en: "1 °C warmer", tr: "1 °C daha sıcak" }
    precip_factor: { value: 1.0, unit: "-", source: "No change", type: assumption, verified: false }
    temp_shift_c: { value: 1.0, unit: "°C", source: "PLAN_EXPANSION E2: +1 °C on Tmax, Tmin and Tdew (sensitivity step, not a projection)", type: assumption, verified: false }
  - id: warm2
    label: { en: "2 °C warmer", tr: "2 °C daha sıcak" }
    precip_factor: { value: 1.0, unit: "-", source: "No change", type: assumption, verified: false }
    temp_shift_c: { value: 2.0, unit: "°C", source: "PLAN_EXPANSION E2: +2 °C on Tmax, Tmin and Tdew (sensitivity step, not a projection)", type: assumption, verified: false }
  - id: dry10_warm1
    label: { en: "10 % less rain and 1 °C warmer", tr: "%10 daha az yağış ve 1 °C daha sıcak" }
    precip_factor: { value: 0.9, unit: "-", source: "PLAN_EXPANSION E2 combined case: precipitation × 0.9", type: assumption, verified: false }
    temp_shift_c: { value: 1.0, unit: "°C", source: "PLAN_EXPANSION E2 combined case: +1 °C", type: assumption, verified: false }

# Station correction of NASA POWER precipitation (15 Nov, OMER_BAKMALI §6 option b).
# Linear scaling: every daily POWER precipitation value is multiplied by
#   MGM/WMO 1991–2020 annual normal (references.yaml mgm_annual_precip_mm) / POWER mean annual
#   precipitation over the complete calendar years of the record.
# Wet days and their timing stay as in POWER; only amounts change. Applied in runner.run_location,
# run_scenarios (before the scenario factor) and run_landscape. The raw POWER-vs-MGM numbers stay in
# the precip_vs_mgm check. Known limits: the normal covers 1991–2020 while POWER covers 2000 onward;
# Develi uses Kayseri Bölge (~29 km away); one annual factor, not month by month.
precip_correction:
  enabled:
    value: true
    unit: "-"
    source: "Project choice (Ömer, 15 Nov): POWER precipitation differs from the nearest WMO station by −14 … +85 % (precip_vs_mgm). Method: linear scaling, the simplest bias correction compared in Teutschbein & Seibert 2012, J. Hydrol. 456–457: 12–29"
    source_url: "https://doi.org/10.1016/j.jhydrol.2012.05.052"
    type: assumption
    verified: false
