        irrigated: *potato_n
      p2o5:
        limited:   &potato_p { <<: *tagem, source: "TAGEM Çizelge 22, Orta Anadolu, Patates Sulu", rows: [ { max: 1.0, kg_per_da: 14 }, { max: 2.0, kg_per_da: 12 }, { max: 3.0, kg_per_da: 10 }, { max: 4.0, kg_per_da: 9 }, { max: 5.0, kg_per_da: 8 }, { max: 6.0, kg_per_da: 6 }, { max: 7.0, kg_per_da: 5 }, { max: 8.0, kg_per_da: 4 }, { max: null, kg_per_da: 0 } ] }
        irrigated: *potato_p
      k2o:
        limited:   &potato_k { <<: *tagem, source: "TAGEM Çizelge 13, Orta Anadolu, Patates Sulu", rows: [ { max: 10.0, kg_per_da: 15 }, { max: 20.0, kg_per_da: 12 }, { max: 25.0, kg_per_da: 8 }, { max: 30.0, kg_per_da: 6 }, { max: null, kg_per_da: 0 } ] }
        irrigated: *potato_k
    uptake_kg_per_t:
      n:    { value: null, unit: kg N per t tubers, <<: *report, source: "Bekleniyor (Türk kaynağı bulunamadı)" }
      p2o5: { value: null, unit: kg P2O5 per t tubers, <<: *report, source: "Bekleniyor" }
      k2o:  { value: null, unit: kg K2O per t tubers, <<: *report, source: "Bekleniyor" }
    salinity_threshold_ec_ds_m: { value: 1.7, unit: dS/m ECe, <<: *fao29, source: "FAO 29 Table 4: patates 1,7 dS/m" }
    n_split:
      rainfed:   &potato_split [ { timing: top_1, fraction: 0.4, label: { en: "At hoeing", tr: "Çapada" } }, { timing: top_2, fraction: 0.6, label: { en: "With the irrigations", tr: "Sulamalarla" } } ]
      limited:   *potato_split
      irrigated: *potato_split
    base_products:
      - { product: npk_15_15_15 }
    top_products:
      - { product: can }
    k_product: potassium_sulfate
    advice:
      - id: potato_sulfur
        when: { ph: { gt: 7.7 } }
        text: { en: "Soil pH is above 7.7: very finely ground sulfur about one month before planting is suggested to lower the pH.", tr: "Toprak pH'ı 7,7'nin üzerinde: pH'ı düşürmek için dikimden yaklaşık bir ay önce çok ince öğütülmüş toz kükürt önerilir." }
        <<: *toros_guide
        source: "Toros Gübreleme Rehberi s. 57: pH 7,7'den yüksekse dikimden bir ay kadar önce toz kükürt (doz verilmiyor)"
      - id: potato_drip_program
        when: { drip: { eq: true } }
        text: { en: "For drip fertigation of potato no published schedule was found; ask a local agronomist for a drip programme.", tr: "Patateste damla sulamayla gübreleme için yayımlanmış bir takvim bulunamadı; damla programı için bölgedeki ziraat mühendisine danışın." }
        <<: *toros_guide
        source: "Toros Gübreleme Rehberi s. 57: damla sulamada program için uzmanlarına danışılmasını söylüyor"

  onion:
    label: { en: "Dry onion", tr: "Kuru soğan" }
    in_rotations: false
    default_target_yield_kg_per_da:
      rainfed:   { value: null, unit: kg/da, <<: *report, source: "Kuru tarımda yetiştirilmez" }
      limited:   { value: null, unit: kg/da, <<: *report, source: "Bekleniyor; TAGEM tabloları hedef verim istemez" }
      irrigated: { value: null, unit: kg/da, <<: *report, source: "Bekleniyor (TÜİK kuru soğan verimi)" }
    soil_tables:
      n:
        limited:   &onion_n { <<: *tagem, source: "TAGEM Çizelge 1, Orta Anadolu, Kuru soğan Sulu", rows: [ { max: 1.0, kg_per_da: 14 }, { max: 2.0, kg_per_da: 13 }, { max: 3.0, kg_per_da: 12 }, { max: null, kg_per_da: 10 } ] }
        irrigated: *onion_n
      p2o5:
        limited:   &onion_p { <<: *tagem, source: "TAGEM Çizelge 22, Orta Anadolu, K. Soğan Sulu", rows: [ { max: 1.0, kg_per_da: 10 }, { max: 2.0, kg_per_da: 9 }, { max: 3.0, kg_per_da: 8 }, { max: 4.0, kg_per_da: 7 }, { max: 5.0, kg_per_da: 6 }, { max: 6.0, kg_per_da: 5 }, { max: 7.0, kg_per_da: 4 }, { max: 8.0, kg_per_da: 3 }, { max: null, kg_per_da: 0 } ] }
        irrigated: *onion_p
      k2o:
        limited:   &onion_k { <<: *tagem, type: assumption, verified: false, source: "TAGEM Çizelge 13'te soğan satırı yok; 'Sebze Sulu' satırı kullanıldı (kabul)", rows: [ { max: 10.0, kg_per_da: 12 }, { max: 20.0, kg_per_da: 10 }, { max: 25.0, kg_per_da: 8 }, { max: 30.0, kg_per_da: 6 }, { max: null, kg_per_da: 0 } ] }
        irrigated: *onion_k
    # Used only where no TAGEM N row applies (rainfed). Yalova (Marmara) drip trial, not Central Anatolia.
    n_response:
      a: { value: 2449.54, unit: kg/da, source: "Albayrak ve Elmacı 2017, Bahçe 46(1):21–30 (Yalova, damla sulu, 2012–13): verim = 2449,54 + 215,40·N − 8,29·N², R² = 0,82", source_url: "https://dergipark.org.tr/en/download/article-file/506203", type: literature, verified: true }
      b: { value: 215.40, unit: kg yield per kg N, source: "Albayrak ve Elmacı 2017, aynı denklem", source_url: "https://dergipark.org.tr/en/download/article-file/506203", type: literature, verified: true }
      c: { value: -8.29, unit: kg yield per (kg N)², source: "Albayrak ve Elmacı 2017: eğrinin tepesi −b/2c = 12,99 ≈ 13 kg N/da (makale 13 diyor; 12,91 fiyatla hesaplanan ekonomik doz, kullanılmaz)", source_url: "https://dergipark.org.tr/en/download/article-file/506203", type: literature, verified: true }
    uptake_kg_per_t:
      n:    { value: null, unit: kg N per t bulbs, <<: *report, source: "Bekleniyor (Türk kaynağı bulunamadı)" }
      p2o5: { value: null, unit: kg P2O5 per t bulbs, <<: *report, source: "Bekleniyor" }
      k2o:  { value: null, unit: kg K2O per t bulbs, <<: *report, source: "Bekleniyor" }
    salinity_threshold_ec_ds_m: { value: 1.2, unit: dS/m ECe, <<: *fao29, source: "FAO 29 Table 4: soğan 1,2 dS/m" }
    n_split:
      rainfed:   &onion_split [ { timing: top_1, fraction: 0.5, label: { en: "4–5 leaf stage", tr: "4–5 yaprak döneminde" } }, { timing: top_2, fraction: 0.5, label: { en: "Bulb start", tr: "Baş bağlama başında" } } ]
      limited:   *onion_split
      irrigated: *onion_split
    base_products:
      - { product: npk_15_15_15 }
    top_products:
      - { product: ammonium_sulfate }
    k_product: potassium_sulfate
    advice:
      - id: onion_n_limit
        text: { en: "More nitrogen than the plan gives causes split bulbs, thick necks and storage rot.", tr: "Plandan fazla azot ikiz baş, kalın boyun ve depoda çürümeye yol açar." }
        <<: *report
      - id: onion_sulfur
        text: { en: "Ammonium sulfate is used for top dressing because it also brings sulfur, which onion needs.", tr: "Üst gübrede amonyum sülfat kullanılır; soğanın ihtiyaç duyduğu kükürdü de verir." }
        <<: *report

# ---------------------------------------------------------------- general advice (all crops)
advice:
  - id: soil_test
    when: { p2o5_kg_per_da: { missing: true }, olsen_p_ppm: { missing: true } }
    text: { en: "Satellites and SoilGrids cannot measure phosphorus, potassium, lime, salt or zinc. The official tables need a lab soil test (0–20 cm); until then the plan shows nitrogen only.", tr: "Uydular ve SoilGrids fosfor, potasyum, kireç, tuz ve çinkoyu ölçemez. Resmi tablolar laboratuvar toprak analizi (0–20 cm) ister; o zamana kadar plan sadece azotu gösterir." }
    <<: *tagem
    source: "TAGEM Gübre Tavsiyeleri s. 1: gübre miktarı önce toprak analizi, sonra bölge ve bitkiye göre tavsiye çizelgesinden belirlenir"
  - id: zn_check
    when: { flags_any: [zn_likely_low] }
    text: { en: "Zinc is short in most alkaline, limy Central Anatolian soils; a zinc (DTPA) soil test is suggested. Until then the plan uses a zinc-containing fertilizer where the crop has one.", tr: "Orta Anadolu'nun alkali, kireçli topraklarının çoğunda çinko eksiktir; çinko (DTPA) analizi önerilir. O zamana kadar plan, ürün için varsa çinkolu gübre kullanır." }
    <<: *cakmak
  - id: banding
    when: { banding: { eq: false } }
    text: { en: "With a combined seed drill the base fertilizer goes in a band next to the seed; the guide then uses 2 kg/da less compound or 1 kg/da less DAP.", tr: "Kombine mibzerle taban gübre tohumun yanına bant halinde verilir; rehber bu durumda kompozeyi 2 kg/da, DAP'ı 1 kg/da azaltır." }
    <<: *toros_wheat
  - id: low_om_organic
    when: { flags_any: [low_om] }
    text: { en: "Organic matter is very low: farmyard manure or compost helps the soil hold water and nutrients.", tr: "Organik madde çok düşük: ahır gübresi ya da kompost toprağın suyu ve besini tutmasına yardım eder." }
    <<: *report
  - id: drip_no_ca_mix
    when: { drip: { eq: true } }
    text: { en: "In drip fertigation, do not put calcium nitrate in the same tank as phosphate or sulfate fertilizers; they settle and block the drippers.", tr: "Damla sulamada kalsiyum nitratı fosfatlı ya da sülfatlı gübrelerle aynı tanka koymayın; çöker ve damlatıcıları tıkar." }
    <<: *toros_guide
  - id: foliar_timing
    when: { flags_any: [zn_low, zn_likely_low] }
    text: { en: "Spray foliar fertilizers early in the morning or in the cool evening, not in heat or strong wind.", tr: "Yaprak gübrelerini sabah erken ya da akşam serinliğinde uygulayın; sıcakta ve kuvvetli rüzgârda uygulamayın." }
    <<: *report
