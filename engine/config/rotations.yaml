# Owner: Gümüş (Rol B). Texts and traits researched for Muhammet's SOURCES.md §7, §9 (strategy.*, trait.*) on 2026-11-14 by Gümüş.
# Rotation ids are fixed: fallow_wheat (baseline, always first), chickpea_wheat, lentil_wheat.
# V objects with value: null = not yet sourced ("pending"); the UI shows them as pending, never as a number.
# Wording rule: never "recommended", "best", "banned", "profit guaranteed".

_sources:   # shared references (YAML anchors), not exported
  trial: &trial
    source: "Gültekin vd. 2017, KSÜ Doğa Bil. Derg. 20 (Özel Sayı): 283–287 — Konya kuru koşul, 2011–2014"
    source_url: "https://doi.org/10.18016/ksudobil.349258"
  erosion: &erosion
    source: "T.C. Tarım ve Orman Bakanlığı, Konya Toprak Su ve Çölleşme ile Mücadele Araştırma Enstitüsü — Tarihçe"
    source_url: "https://arastirma.tarimorman.gov.tr/konyatopraksu/Menu/13/Tarihce"
  pse: &pse
    source: "Demiralay İ., 'Nadasın Etkinliği' (Özbek vd. 1967 atfı); Adak M.S. 1999 (Ayday ve Oylukan 1984 atfı)"
    source_url: "https://dergipark.org.tr/en/download/article-file/34779"
  tillage: &tillage
    source: "Çelebi H., Bal H. 'Orta Anadolu Şartlarında Toprak İşleme ve Ekim Metotlarının Toprak ve Su Muhafaza Bakımından Önemi'"
    source_url: "https://dergipark.org.tr/en/download/article-file/34778"
  adak: &adak
    source: "Adak M.S. 1999. Tarla Bitkileri Merkez Araştırma Enstitüsü Dergisi 8(1-2) — Haymana 1995–98, nadas-buğday ve kışlık mercimek-buğday"
    source_url: "https://dergipark.org.tr/tr/download/article-file/118589"
  rhizobium: &rhizobium
    source: "T.C. Tarım ve Orman Bakanlığı, Toprak Gübre ve Su Kaynakları Merkez Araştırma Enstitüsü — AZOTEK-2 nohut Rhizobium aşılama dokümanı"
    source_url: "https://arastirma.tarimorman.gov.tr/toprakgubre/Belgeler/Mikrobiyal_Gubre/AZOTEK-2%20NOHUT.pdf"

rotations:
  - id: fallow_wheat
    is_baseline: true
    crops: [fallow, wheat]
    label: { en: "Fallow → Wheat", tr: "Nadas → Buğday" }
    soil_traits:
      n_fixing: false
      tillage_passes:
        value: 3
        unit: "passes/year"
        source: "Çelebi ve Bal: Orta Anadolu'da nadasta ilk sürüm Mart–Nisan'da soklu pullukla, ikinci sürüm graham pulluğuyla, üçüncü sürüm rodvider ile (karanadas: soklu pullukla anız bozumu, diskli tırmıkla ikileme ve üçleme)"
        source_url: "https://dergipark.org.tr/en/download/article-file/34778"
        type: literature
        verified: true
        as_of: "2026-11-14"
      note:
        en: "The field is tilled about three times in the fallow year and stays bare for over a year. No nitrogen-fixing crop."
        tr: "Nadas yılında tarla yaklaşık üç kez sürülür ve bir yıldan uzun süre çıplak kalır. Azot bağlayan bir ürün yoktur."
    strategy:
      why:
        en: "This is the current practice in rainfed Central Anatolia, so every other option is compared with it."
        tr: "Orta Anadolu kuru tarımında bugünkü uygulama budur; diğer seçenekler onunla karşılaştırılır."
      evidence:
        - text:
            en: "In a 2011–2014 dryland trial in Konya, wheat after fallow yielded 286 kg/da on average, more than after lentil (249) or chickpea (228)."
            tr: "Konya'da 2011–2014 kuru koşul denemesinde nadastan sonra buğday ortalama 286 kg/da verdi; mercimekten (249) ve nohuttan (228) sonra daha düşüktü."
          <<: *trial
        - text:
            en: "Studies in Central Anatolia found that fallow stores about 11–29 % of the precipitation as extra soil water, depending on the year, soil and technique."
            tr: "Orta Anadolu çalışmaları, nadasın yağışın yaklaşık %11–29'unu fazladan toprak suyu olarak biriktirdiğini buldu; oran yıla, toprağa ve tekniğe göre değişir."
          <<: *pse
        - text:
            en: "The Ministry's Konya soil and desertification institute lists fallow–cereal farming with disc ploughs and disc harrows among the causes of the 1960s Karapınar wind erosion."
            tr: "Bakanlığın Konya Toprak Su ve Çölleşme enstitüsü, 1960'lardaki Karapınar rüzgâr erozyonunun nedenleri arasında diskli pulluk ve diskharrow ile yapılan nadas-hububat tarımını sayar."
          <<: *erosion
      benefits:
        - { en: "More stored soil water at wheat sowing, which matters most in dry years.", tr: "Buğday ekiminde toprakta daha çok su; bu en çok kurak yıllarda önemlidir." }
        - { en: "Wheat yield after fallow was the highest in the Konya dryland trial.", tr: "Konya kuru koşul denemesinde en yüksek buğday verimi nadastan sonra alındı." }
        - { en: "Familiar to farmers; no new crop, seed or market is needed.", tr: "Çiftçinin bildiği yöntem; yeni ürün, tohum ya da pazar gerekmez." }
      gaps:
        - { en: "How much soil is lost to wind on bare fallow is not measured here; the tool counts windy, dry, bare days only.", tr: "Çıplak nadasta rüzgârla ne kadar toprak kaybolduğu burada ölçülmüyor; araç sadece rüzgârlı, kuru ve çıplak günleri sayar." }
        - { en: "Stubble or reduced tillage during fallow can change both water storage and erosion; the model does not include it.", tr: "Nadasta anız bırakmak ya da azaltılmış toprak işleme hem su birikimini hem erozyonu değiştirebilir; model bunu içermez." }
        - { en: "The fallow year earns no crop income; its value depends on next year's wheat and prices.", tr: "Nadas yılı ürün geliri getirmez; değeri ertesi yılın buğdayına ve fiyatlara bağlıdır." }
      local_review:
        - { en: "How many tillage passes are made in the fallow year on this field, and with which tools?", tr: "Bu tarlada nadas yılında kaç kez ve hangi aletle toprak işleniyor?" }
        - { en: "Is the soil deep enough to store the extra water (shallow soils store less)?", tr: "Toprak fazladan suyu tutacak kadar derin mi (sığ topraklar daha az biriktirir)?" }
        - { en: "Can stubble be kept on the surface to reduce wind erosion?", tr: "Rüzgâr erozyonunu azaltmak için anız yüzeyde bırakılabilir mi?" }

  - id: chickpea_wheat
    is_baseline: false
    crops: [chickpea, wheat]
    label: { en: "Chickpea → Wheat", tr: "Nohut → Buğday" }
    soil_traits:
      n_fixing: true
      tillage_passes:
        value: null
        unit: "passes/year"
        source: "bulunamadı — denenen: Çelebi ve Bal, Adak 1999, Gültekin vd. 2017 (baklagil yılındaki işleme sayısı verilmiyor)"
        source_url: ""
        type: assumption
        verified: false
        as_of: "2026-11-14"
      note:
        en: "Chickpea forms root nodules with Rhizobium bacteria and fixes nitrogen from the air. The amount depends on the season; check it with a soil test."
        tr: "Nohut, Rhizobium bakterileriyle kök nodülü oluşturur ve havadaki azotu bağlar. Miktar sezona bağlıdır; toprak analiziyle kontrol edin."
    strategy:
      why:
        en: "A spring legume replaces part of the bare fallow year with a cash crop that also fixes nitrogen."
        tr: "Yazlık bir baklagil, çıplak nadas yılının bir kısmını gelir getiren ve azot bağlayan bir ürünle doldurur."
      evidence:
        - text:
            en: "In the Konya dryland trial (2011–2014), wheat after chickpea yielded 228 kg/da on average, against 286 after fallow."
            tr: "Konya kuru koşul denemesinde (2011–2014) nohuttan sonra buğday ortalama 228 kg/da verdi; nadastan sonra 286 kg/da idi."
          <<: *trial
        - text:
            en: "Chickpea is inoculated with Rhizobium so that its root nodules fix atmospheric nitrogen."
            tr: "Nohut, kök nodüllerinin havadaki azotu bağlaması için Rhizobium ile aşılanır."
          <<: *rhizobium
      benefits:
        - { en: "Income from the chickpea crop in the year that would otherwise be fallow.", tr: "Normalde nadas olacak yılda nohuttan gelir." }
        - { en: "Fewer bare days, so less wind exposure than fallow.", tr: "Daha az çıplak gün, dolayısıyla nadasa göre rüzgâra daha az açık." }
        - { en: "Biological nitrogen fixation can lower the need for nitrogen fertiliser.", tr: "Biyolojik azot bağlama, azotlu gübre ihtiyacını azaltabilir." }
      gaps:
        - { en: "The kg of nitrogen left for the next wheat is not estimated; it varies by season and needs a soil test.", tr: "Sonraki buğdaya kalan azot (kg) tahmin edilmiyor; sezona göre değişir, toprak analizi gerekir." }
        - { en: "A local chickpea price for Konya/Kayseri in 2026 was not found; the default comes from another exchange.", tr: "Konya/Kayseri için 2026 nohut fiyatı bulunamadı; varsayılan değer başka bir borsadan." }
        - { en: "Diseases such as Ascochyta blight and the spring sowing date can change yields a lot; the model only uses water.", tr: "Antraknoz gibi hastalıklar ve ilkbahar ekim tarihi verimi çok değiştirebilir; model sadece suyu kullanır." }
      local_review:
        - { en: "Which chickpea variety and sowing date fit this district?", tr: "Bu ilçeye hangi nohut çeşidi ve ekim tarihi uygun?" }
        - { en: "Is there a reliable buyer and price for chickpea at harvest?", tr: "Hasatta nohut için güvenilir bir alıcı ve fiyat var mı?" }
        - { en: "How much nitrogen fertiliser can be reduced for the following wheat?", tr: "Sonraki buğday için azotlu gübre ne kadar azaltılabilir?" }

  - id: lentil_wheat
    is_baseline: false
    crops: [lentil, wheat]
    label: { en: "Lentil → Wheat", tr: "Mercimek → Buğday" }
    soil_traits:
      n_fixing: true
      tillage_passes:
        value: null
        unit: "passes/year"
        source: "bulunamadı — denenen: Çelebi ve Bal, Adak 1999, Gültekin vd. 2017 (baklagil yılındaki işleme sayısı verilmiyor)"
        source_url: ""
        type: assumption
        verified: false
        as_of: "2026-11-14"
      note:
        en: "Lentil is a legume and fixes nitrogen from the air with Rhizobium bacteria. The amount depends on the season; check it with a soil test."
        tr: "Mercimek bir baklagildir ve Rhizobium bakterileriyle havadaki azotu bağlar. Miktar sezona bağlıdır; toprak analiziyle kontrol edin."
    strategy:
      why:
        en: "Lentil is the legume whose following wheat came closest to wheat after fallow in the Konya dryland trial."
        tr: "Konya kuru koşul denemesinde, sonrasındaki buğday verimi nadasa en çok yaklaşan baklagil mercimekti."
      evidence:
        - text:
            en: "In the Konya dryland trial (2011–2014), wheat after lentil yielded 249 kg/da on average, against 286 after fallow and 228 after chickpea."
            tr: "Konya kuru koşul denemesinde (2011–2014) mercimekten sonra buğday ortalama 249 kg/da verdi; nadastan sonra 286, nohuttan sonra 228 kg/da idi."
          <<: *trial
        - text:
            en: "In a 1995–98 Central Anatolia study (Haymana), the winter lentil–wheat system ranked second after fallow–wheat for wheat yield; continuous wheat was lowest."
            tr: "Orta Anadolu'da (Haymana) 1995–98 çalışmasında kışlık mercimek-buğday sistemi, buğday verimi bakımından nadas-buğdaydan sonra ikinci geldi; sürekli buğday en düşüktü."
          <<: *adak
      benefits:
        - { en: "Income from lentil in the year that would otherwise be fallow.", tr: "Normalde nadas olacak yılda mercimekten gelir." }
        - { en: "Fewer bare days than fallow, so less wind exposure.", tr: "Nadasa göre daha az çıplak gün, dolayısıyla rüzgâra daha az açık." }
        - { en: "Nitrogen fixation and improved soil properties as a legume.", tr: "Baklagil olarak azot bağlama ve toprak özelliklerinde iyileşme." }
      gaps:
        - { en: "The trial used green lentil (Sultan-1); red lentil may behave differently.", tr: "Denemede yeşil mercimek (Sultan-1) kullanıldı; kırmızı mercimek farklı sonuç verebilir." }
        - { en: "The kg of nitrogen left for the next wheat is not estimated; it needs a soil test.", tr: "Sonraki buğdaya kalan azot (kg) tahmin edilmiyor; toprak analizi gerekir." }
        - { en: "Lentil harvest losses and weed control are not in the model.", tr: "Mercimek hasat kayıpları ve yabancı ot kontrolü modelde yok." }
      local_review:
        - { en: "Red or green lentil, and which variety, for this district?", tr: "Bu ilçe için kırmızı mı yeşil mercimek mi, hangi çeşit?" }
        - { en: "Is machine harvest of lentil possible on this field?", tr: "Bu tarlada mercimek makineyle hasat edilebilir mi?" }
        - { en: "Does TMO or a local trader buy lentil in this district, and at what price?", tr: "Bu ilçede TMO ya da yerel tüccar mercimek alıyor mu, hangi fiyata?" }
