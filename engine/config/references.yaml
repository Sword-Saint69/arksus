  source: "Jacott C.N., Boden S.A. 2020. J. Exp. Bot. 71(19): 5740–5751 (doi:10.1093/jxb/eraa326): 'temperatures higher than 31 °C limit the success of pollination', Porter ve Gawith 1999 (Eur. J. Agron. 10: 23–36) atfıyla. Kaynak günlük maksimum olduğunu açıkça yazmıyor; motor T2M_MAX'a uyguluyor."
