pse_range:                       # check: pse_literature (fraction 0–1)
  # Literature definition: (soil water under fallow − soil water under crop) / annual precipitation.
  # The engine's PSE is ΔS / P over the fallow period; the check is "info" only.
  low:
    value: 0.11
    unit: "fraction"
    source: "Ayday ve Oylukan (1984), Adak M.S. 1999 içinde: 'Bir defa nadas yılında toprakta biriken nem miktarı yıllık yağışın %11–23'ü kadardır'. Adak M.S. 1999. Tarla Bitkileri Merkez Araştırma Enstitüsü Dergisi 8(1-2)."
    source_url: "https://dergipark.org.tr/tr/download/article-file/118589"
    type: literature
    verified: true
    as_of: "2026-11-14"
  high:
    value: 0.29
    unit: "fraction"
    source: "Özbek vd. (1967), Demiralay İ. 'Nadasın Etkinliği' içinde: Orta Anadolu'da 180 cm toprak derinliğinde nadasın etkinliği %12,9–29,0."
    source_url: "https://dergipark.org.tr/en/download/article-file/34779"
    type: literature
    verified: true
