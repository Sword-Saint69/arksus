# Soil parameters for the water balance engine (owner: Ömer, Rol A).
# Every numeric parameter is a value object (V): value, unit, source, (source_url), type, verified.
#
# STATUS (14 Nov): FAO-56 values checked against the FAO HTML edition (fao.org/4/x0490e),
# verified: true with URL. Project choices from PLAN_MVP (initial fill, wind percentile,
# awc_method, texture aliases) stay type: assumption.
#
# Available water (awc_method: texture_table): SoilGrids 2.0 wv0033 − wv1500 gives 58.6
# (Karapınar) and 67.4 (Develi) mm/m, far below the FAO-56 Table 19 range for the clay-rich
# textures SoilGrids itself reports at these points (decision 14 Nov). The texture class comes
# from SoilGrids Q50 clay/sand/silt 0–30 cm (USDA triangle); AWC, θFC, θWP and REW come from
# FAO-56 Table 19 for that class (range midpoints); TEW = 1000·(θFC − 0.5·θWP)·Ze (Eq. 73).
# Set awc_method to `soilgrids` to use the SoilGrids value instead.

depth_classes:
- id: shallow
  depth_m: 0.6
  label:
    en: Shallow (<60 cm)
    tr: Sığ (<60 cm)
- id: medium
  depth_m: 0.9
  label:
    en: Medium (60–90 cm)
    tr: Orta (60–90 cm)
- id: deep
  depth_m: 1.2
  label:
    en: Deep (>90 cm)
    tr: Derin (>90 cm)
evaporation:
  ze_m:
    value: 0.1
    unit: m
    source: 'FAO-56 Chapter 7, Eq. 73: ''Where unknown, a value for Ze ... of 0.10-0.15 m is recommended'' (lower end; Table 19 TEW column also assumes Ze = 0.10 m)'
    type: literature
    verified: true
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
  tew_mm:
    value: 20.0
    unit: mm
    source: 'FAO-56 Table 19, loam: TEW 16–22 mm for Ze = 0.10 m; Example 31 uses TEW ≈ 20 mm for loam. Used only when no SoilGrids texture is available'
    type: assumption
    verified: true
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
  rew_mm:
    value: 9.0
    unit: mm
    source: 'FAO-56 Table 19, loam: REW 8–10 mm; Example 31 uses REW ≈ 9 mm for loam. Used only when no SoilGrids texture is available'
    type: assumption
    verified: true
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
fallback_awc_mm_per_m:
  karapinar:
    value: 155.0
    unit: mm/m
    source: 'FAO-56 Table 19, loam: θFC − θWP 0.13–0.18 m3/m3 (midpoint). Used only when data/soilgrids/{loc}.json is missing; texture not known then'
    type: assumption
    verified: true
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
  develi:
    value: 155.0
    unit: mm/m
    source: 'FAO-56 Table 19, loam: θFC − θWP 0.13–0.18 m3/m3 (midpoint). Used only when data/soilgrids/{loc}.json is missing; texture not known then'
    type: assumption
    verified: true
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
initial_fill_fraction:
  value: 0.5
  unit: fraction of available water
  source: 'PLAN_MVP §5.3 sequence design (project choice, not a measured value): spin-up wheat starts at 50 % of available water'
  type: assumption
  verified: false
wind_exposure_percentile:
  value: 75
  unit: percentile of daily WS2M_MAX over the full record
  source: 'PLAN_MVP §5.8: stated threshold choice for the wind-exposure count'
  type: assumption
  verified: false
awc_method:
  value: texture_table
  unit: '-'
  source: 'Team decision 14 Nov: SoilGrids AWC judged implausible for its own texture class; see comment above'
  type: assumption
  verified: false
awc_cfvo_correction:
  value: true
  unit: '-'
  source: 'Gümüş, docs/OMER_BAKMALI.md §2–3 (14 Nov): stones hold no water and Table 19 is for fine earth, so AWC × (1 − SoilGrids cfvo 0–100 cm). Set false to switch off'
  type: assumption
  verified: false
