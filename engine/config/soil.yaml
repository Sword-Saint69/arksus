# USDA classes that FAO-56 Table 19 does not list are mapped to the nearest listed class.
texture_table_aliases:
  clay_loam:
    value: silty_clay_loam
    unit: "-"
    source: "Assumption: clay loam is not in FAO-56 Table 19; nearest listed class by clay content (27–40 %) is silty clay loam"
    type: assumption
    verified: false
  sandy_clay_loam:
    value: sandy_loam
    unit: "-"
    source: "Assumption: sandy clay loam is not in FAO-56 Table 19; nearest listed class by sand content is sandy loam"
    type: assumption
    verified: false
  sandy_clay:
    value: clay
    unit: "-"
    source: "Assumption: sandy clay is not in FAO-56 Table 19; nearest listed class by clay content (≥ 35 %) is clay"
    type: assumption
    verified: false
