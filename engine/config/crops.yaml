# Crop parameters for the water balance engine (owner: Ömer, Rol A; calendars from Muhammet).
# Every parameter is a value object (V): value, unit, source, (source_url), type, verified.
#
# STATUS (14 Nov): every FAO-56 table value below was checked against the FAO HTML edition
# (fao.org/4/x0490e) and carries its URL: verified: true. Still assumptions (verified: false):
# sowing dates, stage lengths and the wheat flowering window, until Muhammet's calendars arrive.
# Ky for chick pea and lentil is FAO-56's own default for crops without a Table 24 value.
#
# The engine has no crop-specific branches. An entry WITHOUT a `sowing` key means the
# land stays bare for that part of the rotation (kcb = 0) and the bare period is
# labelled with the entry's id in the ledger.

fallow: {}
wheat:
  sowing:
    value: 10-15
    unit: MM-DD
    source: 'PLAN_MVP §5.3 seed calendar (sown ~15 Oct); replace with SOURCES.md calendar.*.wheat. FAO-56 Table 11 checked: no Central Anatolian wheat row, no chick pea row, lentil only for Europe (April,
      150 d) and arid regions (Oct/Nov). Waiting for Muhammet''s TAGEM / GKTAEM / Bahri Dağdaş calendars (SOURCES.md calendar.*).'
    type: assumption
    verified: false
  stage_days:
    ini:
      value: 150
      unit: days
      source: 'Assumption: winter dormancy to mid-March; total 270 days gives harvest ~12 Jul (PLAN_MVP §5.3). FAO-56 Table 11 winter wheat entries do not match Central Anatolia directly'
      type: assumption
      verified: false
    dev:
      value: 45
      unit: days
      source: Assumption, see ini
      type: assumption
      verified: false
    mid:
      value: 45
      unit: days
      source: Assumption, see ini
      type: assumption
      verified: false
    late:
      value: 30
      unit: days
      source: Assumption, see ini
      type: assumption
      verified: false
  kcb_ini:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, wheat winter: Kcb ini 0.15–0.5; footnote 11: the higher value only for full ground cover on non-frozen soil, so the lower value is used for a crop sown into bare soil with
      a frozen winter'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_mid:
    value: 1.1
    unit: '-'
    source: 'FAO-56 Table 17, wheat winter: Kcb mid 1.10 (climate-adjusted in the engine with Eq. 70)'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_end:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, wheat winter: Kcb end 0.15–0.3; footnote 10: the higher value is for hand-harvested crops, so the lower value is used for machine harvest'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  h_max_m:
    value: 1.0
    unit: m
    source: 'FAO-56 Table 12, winter wheat with frozen soils: maximum crop height 1 m'
    source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
    type: literature
    verified: true
  zr_min_m: &id001
    value: 0.15
    unit: m
    source: 'FAO-56 Annex 8: ''For many annual crops, Zr min can be estimated as 0.15 to 0.20 m'' (lower end)'
    source_url: https://www.fao.org/4/x0490e/x0490e0p.htm
    type: literature
    verified: true
  zr_max_m:
    value: 1.8
    unit: m
    source: 'FAO-56 Table 22, winter wheat: Zr 1.5–1.8 m; footnote 1: the larger value is for modelling and rainfed conditions. Capped by the depth class (max 1.2 m) in the engine'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  p:
    value: 0.55
    unit: '-'
    source: 'FAO-56 Table 22, winter wheat: p 0.55 for ETc ≈ 5 mm/day; adjusted daily with p + 0.04(5 − ETc), limited to 0.1–0.8 (Table 22 footnote 2)'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  ky:
    value: 1.05
    unit: '-'
    source: 'FAO-56 Table 24 (from FAO Irrigation and Drainage Paper 33): winter wheat Ky 1.05'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  flowering:
    offset_from_mid_start_days:
      value: 25
      unit: days after the start of mid-season
      source: 'Assumption: with the seed calendar mid-season starts ~28 Apr, so the window opens ~23 May; replace with a TAGEM / Bahri Dağdaş heading–flowering date'
      type: assumption
      verified: false
    length_days:
      value: 15
      unit: days
      source: 'Assumption: flowering and early grain set, ~23 May – 6 Jun with the seed calendar'
      type: assumption
      verified: false
chickpea:
  sowing:
    value: 04-01
    unit: MM-DD
    source: 'PLAN_MVP §5.3 seed calendar (sown ~1 Apr); replace with SOURCES.md calendar.*.chickpea. FAO-56 Table 11 checked: no Central Anatolian wheat row, no chick pea row, lentil only for Europe (April,
      150 d) and arid regions (Oct/Nov). Waiting for Muhammet''s TAGEM / GKTAEM / Bahri Dağdaş calendars (SOURCES.md calendar.*).'
    type: assumption
    verified: false
  stage_days:
    ini:
      value: 20
      unit: days
      source: 'Assumption: total 105 days gives harvest ~mid July (PLAN_MVP §5.3)'
      type: assumption
      verified: false
    dev:
      value: 30
      unit: days
      source: Assumption, see ini
      type: assumption
      verified: false
    mid:
      value: 35
      unit: days
      source: Assumption, see ini
      type: assumption
      verified: false
    late:
      value: 20
      unit: days
      source: Assumption, see ini
      type: assumption
      verified: false
  kcb_ini:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, legumes group value: Kcb ini 0.15 (chick pea row leaves ini blank)'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_mid:
    value: 0.95
    unit: '-'
    source: 'FAO-56 Table 17, chick pea: Kcb mid 0.95'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_end:
    value: 0.25
    unit: '-'
    source: 'FAO-56 Table 17, chick pea: Kcb end 0.25'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  h_max_m:
    value: 0.4
    unit: m
    source: 'FAO-56 Table 12, chick pea: maximum crop height 0.4 m'
    source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
    type: literature
    verified: true
  zr_min_m: *id001
  zr_max_m:
    value: 1.0
    unit: m
    source: 'FAO-56 Table 22, chick pea: Zr 0.6–1.0 m; footnote 1: the larger value is for modelling and rainfed conditions'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  p:
    value: 0.5
    unit: '-'
    source: 'FAO-56 Table 22, chick pea: p 0.50 for ETc ≈ 5 mm/day'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  ky:
    value: 1.0
    unit: '-'
    source: 'Chick pea is not in FAO-56 Table 24 (FAO-33 lists about 23 crops). FAO-56 Chapter 8: ''For crops where Ky is unknown, the user may use Ky = 1'''
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: assumption
    verified: true
