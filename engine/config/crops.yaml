# Crop parameters for the water balance engine (owner: Ömer, Rol A).
# Every parameter is a value object (V): value, unit, source, (source_url), type, verified.
#
# STATUS (14 Nov): every FAO-56 table value was checked against the FAO HTML edition
# (fao.org/4/x0490e) and carries its URL. Sowing dates are now sourced (Ömer did the
# calendar research that TASKS.md assigns to Muhammet): wheat Gültekin et al. 2017 (Konya),
# chickpea Topalak 2016 (Konya), lentil TTAE + FAO-56 Table 11. Still assumptions: the wheat
# and chickpea stage split, the wheat flowering window, and using Konya calendars for Develi.
#
# 13 DISTRICTS (15 Nov, OMER_BAKMALI §6): one calendar (Konya) for all 13 districts — an
# ASSUMPTION for the colder/higher ones (Gemerek, Boğazlıyan, Çankırı, Develi). Searched, not
# found: a sourced sowing/harvest calendar for Sivas, Yozgat or Çankırı dryland wheat. Only
# support for sowing: Yozgat farmers "normally finish sowing by 15 October" (Anadolu Ajansı,
# 2025, aa.com.tr/tr/ekonomi/yozgatta-kuraklik-nedeniyle-bugday-ekimi-kasim-ayina-sarkti/3745682),
# consistent with 15 Oct. No harvest-date source. Next check: MODIS NDVI dry-down month per
# district (validate.ndvi_comparison) — a second calendar only if the satellite shows a lag.
# Ky for chick pea and lentil is FAO-56's own default for crops without a Table 24 value.
#
# The engine has no crop-specific branches. An entry WITHOUT a `sowing` key means the
# land stays bare for that part of the rotation (kcb = 0) and the bare period is
# labelled with the entry's id in the ledger.

fallow: {}
wheat:
  sowing:
    value: 10-15
    unit: MM-DD
    source: 'Gültekin et al. 2017, KSÜ Doğa Bil. Derg. 20(Özel Sayı):283–287, doi:10.18016/ksudobil.349258 (Bahri Dağdaş, Konya, dryland): sowing later than October lowers yields in the region (citing Topal
      1993). Mid-October chosen inside that window. Same date used for all 13 districts (assumption outside Konya; Yozgat: farmers normally finish sowing by 15 Oct, Anadolu Ajansı 2025)'
    source_url: https://dergipark.org.tr/en/download/article-file/390551
    type: literature
    verified: true
  stage_days:
    ini:
      value: 150
      unit: days
      source: 'Total 270 days = sowing 15 Oct → harvest ~11 Jul. July harvest: Gültekin et al. 2017 (trial field ''harvested in July 2010'', Konya). Split between stages is an assumption: FAO-56 Table 11
        has no Central Anatolian winter-wheat row'
      source_url: https://dergipark.org.tr/en/download/article-file/390551
      type: assumption
      verified: false
    dev:
      value: 45
      unit: days
      source: 'Total 270 days = sowing 15 Oct → harvest ~11 Jul. July harvest: Gültekin et al. 2017 (trial field ''harvested in July 2010'', Konya). Split between stages is an assumption: FAO-56 Table 11
        has no Central Anatolian winter-wheat row'
      source_url: https://dergipark.org.tr/en/download/article-file/390551
      type: assumption
      verified: false
    mid:
      value: 45
      unit: days
      source: 'Total 270 days = sowing 15 Oct → harvest ~11 Jul. July harvest: Gültekin et al. 2017 (trial field ''harvested in July 2010'', Konya). Split between stages is an assumption: FAO-56 Table 11
        has no Central Anatolian winter-wheat row'
      source_url: https://dergipark.org.tr/en/download/article-file/390551
      type: assumption
      verified: false
    late:
      value: 30
      unit: days
      source: 'Total 270 days = sowing 15 Oct → harvest ~11 Jul. July harvest: Gültekin et al. 2017 (trial field ''harvested in July 2010'', Konya). Split between stages is an assumption: FAO-56 Table 11
        has no Central Anatolian winter-wheat row'
      source_url: https://dergipark.org.tr/en/download/article-file/390551
      type: assumption
      verified: false
  kcb_ini:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, wheat winter: Kcb ini 0.15–0.5; footnote 11: the higher value only for full ground cover on non-frozen soil, so the lower value is used for a crop sown into bare soil with
      a frozen winter'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_mid:
    value: 1.1
    unit: '-'
    source: 'FAO-56 Table 17, wheat winter: Kcb mid 1.10 (climate-adjusted in the engine with Eq. 70)'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_end:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, wheat winter: Kcb end 0.15–0.3; footnote 10: the higher value is for hand-harvested crops, so the lower value is used for machine harvest'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  h_max_m:
    value: 1.0
    unit: m
    source: 'FAO-56 Table 12, winter wheat with frozen soils: maximum crop height 1 m'
    source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
    type: literature
    verified: true
  zr_min_m: &id001
    value: 0.15
    unit: m
    source: 'FAO-56 Annex 8: ''For many annual crops, Zr min can be estimated as 0.15 to 0.20 m'' (lower end)'
    source_url: https://www.fao.org/4/x0490e/x0490e0p.htm
    type: literature
    verified: true
  zr_max_m:
    value: 1.8
    unit: m
    source: 'FAO-56 Table 22, winter wheat: Zr 1.5–1.8 m; footnote 1: the larger value is for modelling and rainfed conditions. Capped by the depth class (max 1.2 m) in the engine'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  p:
    value: 0.55
    unit: '-'
    source: 'FAO-56 Table 22, winter wheat: p 0.55 for ETc ≈ 5 mm/day; adjusted daily with p + 0.04(5 − ETc), limited to 0.1–0.8 (Table 22 footnote 2)'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  ky:
    value: 1.05
    unit: '-'
    source: 'FAO-56 Table 24 (from FAO Irrigation and Drainage Paper 33): winter wheat Ky 1.05'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  flowering:
    offset_from_mid_start_days:
      value: 25
      unit: days after the start of mid-season
      source: 'Assumption: with the seed calendar mid-season starts ~28 Apr, so the window opens ~23 May; replace with a TAGEM / Bahri Dağdaş heading–flowering date'
      type: assumption
      verified: false
    length_days:
      value: 15
      unit: days
      source: 'Assumption: flowering and early grain set, ~23 May – 6 Jun with the seed calendar'
      type: assumption
      verified: false
chickpea:
  sowing:
    value: 03-25
    unit: MM-DD
    source: 'Topalak C. 2016, MSc thesis, Selçuk Üniv., Konya (Beyşehir, 2014): sowing on 25 March or earlier gave the highest seed yield; chickpea in Konya is sown from March to early May. Same date used
      for Develi (no Kayseri source found)'
    source_url: https://acikerisim.selcuk.edu.tr/items/51c9a989-4586-4230-a48d-c57e605cef7b
    type: literature
    verified: true
  stage_days:
    ini:
      value: 17
      unit: days
      source: 'Total 129 days = sowing 25 Mar → harvest ~1 Aug: Topalak 2016 harvested 1–15 Aug 2014 (Konya, single wet year). Stage split uses the FAO-56 Table 11 lentil (Europe) proportions 20/30/60/40,
        since chick pea has no row in Table 11'
      source_url: https://acikerisim.selcuk.edu.tr/items/51c9a989-4586-4230-a48d-c57e605cef7b
      type: assumption
      verified: false
    dev:
      value: 26
      unit: days
      source: 'Total 129 days = sowing 25 Mar → harvest ~1 Aug: Topalak 2016 harvested 1–15 Aug 2014 (Konya, single wet year). Stage split uses the FAO-56 Table 11 lentil (Europe) proportions 20/30/60/40,
        since chick pea has no row in Table 11'
      source_url: https://acikerisim.selcuk.edu.tr/items/51c9a989-4586-4230-a48d-c57e605cef7b
      type: assumption
      verified: false
    mid:
      value: 52
      unit: days
      source: 'Total 129 days = sowing 25 Mar → harvest ~1 Aug: Topalak 2016 harvested 1–15 Aug 2014 (Konya, single wet year). Stage split uses the FAO-56 Table 11 lentil (Europe) proportions 20/30/60/40,
        since chick pea has no row in Table 11'
      source_url: https://acikerisim.selcuk.edu.tr/items/51c9a989-4586-4230-a48d-c57e605cef7b
      type: assumption
      verified: false
    late:
      value: 34
      unit: days
      source: 'Total 129 days = sowing 25 Mar → harvest ~1 Aug: Topalak 2016 harvested 1–15 Aug 2014 (Konya, single wet year). Stage split uses the FAO-56 Table 11 lentil (Europe) proportions 20/30/60/40,
        since chick pea has no row in Table 11'
      source_url: https://acikerisim.selcuk.edu.tr/items/51c9a989-4586-4230-a48d-c57e605cef7b
      type: assumption
      verified: false
  kcb_ini:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, legumes group value: Kcb ini 0.15 (chick pea row leaves ini blank)'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_mid:
    value: 0.95
    unit: '-'
    source: 'FAO-56 Table 17, chick pea: Kcb mid 0.95'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_end:
    value: 0.25
    unit: '-'
    source: 'FAO-56 Table 17, chick pea: Kcb end 0.25'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  h_max_m:
    value: 0.4
    unit: m
    source: 'FAO-56 Table 12, chick pea: maximum crop height 0.4 m'
    source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
    type: literature
    verified: true
  zr_min_m: *id001
  zr_max_m:
    value: 1.0
    unit: m
    source: 'FAO-56 Table 22, chick pea: Zr 0.6–1.0 m; footnote 1: the larger value is for modelling and rainfed conditions'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  p:
    value: 0.5
    unit: '-'
    source: 'FAO-56 Table 22, chick pea: p 0.50 for ETc ≈ 5 mm/day'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  ky:
    value: 1.0
    unit: '-'
    source: 'Chick pea is not in FAO-56 Table 24 (FAO-33 lists about 23 crops). FAO-56 Chapter 8: ''For crops where Ky is unknown, the user may use Ky = 1'''
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: assumption
    verified: true
lentil:
  sowing:
    value: 03-01
    unit: MM-DD
    source: 'TTAE (Trakya Tarımsal Araştırma Enstitüsü), ''Mercimek Tarımı'' (S. Süzer): green lentil is spring-sown in Central Anatolia; spring sowing in early spring, end of February to early March. Same
      date used for both districts'
    source_url: https://arastirma.tarimorman.gov.tr/ttae/Sayfalar/Detay.aspx?SayfaId=81
    type: literature
    verified: true
  stage_days:
    ini:
      value: 20
      unit: days
      source: 'FAO-56 Table 11, lentil, April planting, Europe: 20 / 30 / 60 / 40 = 150 days (→ harvest ~28 Jul). Not a Central Anatolian value; no local harvest date found (TTAE gives only a ripeness rule)'
      source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
      type: literature
      verified: true
    dev:
      value: 30
      unit: days
      source: 'FAO-56 Table 11, lentil, April planting, Europe: 20 / 30 / 60 / 40 = 150 days (→ harvest ~28 Jul). Not a Central Anatolian value; no local harvest date found (TTAE gives only a ripeness rule)'
      source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
      type: literature
      verified: true
    mid:
      value: 60
      unit: days
      source: 'FAO-56 Table 11, lentil, April planting, Europe: 20 / 30 / 60 / 40 = 150 days (→ harvest ~28 Jul). Not a Central Anatolian value; no local harvest date found (TTAE gives only a ripeness rule)'
      source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
      type: literature
      verified: true
    late:
      value: 40
      unit: days
      source: 'FAO-56 Table 11, lentil, April planting, Europe: 20 / 30 / 60 / 40 = 150 days (→ harvest ~28 Jul). Not a Central Anatolian value; no local harvest date found (TTAE gives only a ripeness rule)'
      source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
      type: literature
      verified: true
  kcb_ini:
    value: 0.15
    unit: '-'
    source: 'FAO-56 Table 17, legumes group value: Kcb ini 0.15 (lentil row leaves ini blank)'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
