    source: 'FAO-56 Table 17, lentil: Kcb mid 1.05'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  kcb_end:
    value: 0.2
    unit: '-'
    source: 'FAO-56 Table 17, lentil: Kcb end 0.20'
    source_url: https://www.fao.org/4/x0490e/x0490e0c.htm
    type: literature
    verified: true
  h_max_m:
    value: 0.5
    unit: m
    source: 'FAO-56 Table 12, lentil: maximum crop height 0.5 m'
    source_url: https://www.fao.org/4/x0490e/x0490e0b.htm
    type: literature
    verified: true
  zr_min_m: *id001
  zr_max_m:
    value: 0.8
    unit: m
    source: 'FAO-56 Table 22, lentil: Zr 0.6–0.8 m; footnote 1: the larger value is for modelling and rainfed conditions'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
    type: literature
    verified: true
  p:
    value: 0.5
    unit: '-'
    source: 'FAO-56 Table 22, lentil: p 0.50 for ETc ≈ 5 mm/day'
    source_url: https://www.fao.org/4/x0490e/x0490e0e.htm
